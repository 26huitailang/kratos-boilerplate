global:
  resolve_timeout: 5m

route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "webhook"

receivers:
  - name: "webhook"
    webhook_configs:
      - url: "http://localhost:5000/alerts"
        send_resolved: true

  - name: "email"
    email_configs:
      - to: "admin@example.com"
        from: "alertmanager@example.com"
        smarthost: "smtp.example.com:587"
        auth_username: "alertmanager"
        auth_password: "password"
        auth_secret: "secret"
        auth_identity: "alertmanager@example.com"
